services:
  spatial_db:
    image: postgis/postgis:15-3.3
    container_name: cdmx_spatial_warehouse
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-urban_intelligence_cdmx}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./notebooks/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_intelligence_cdmx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    name: cdmx_spatial_data
